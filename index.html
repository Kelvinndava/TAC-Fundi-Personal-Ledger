<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAC Fundi — Personal Ledger</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon_32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon_192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon_180.png">
<meta name="theme-color" content="#1b2a4a">

<!-- iOS: makes "Add to Home Screen" behave like a real app (own window, no Safari chrome) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAC Fundi">
<style>
:root{
  --paper:#e8e4d9;--paper-line:#c9c3b2;--card:#f3f1e9;--ink:#1b2a4a;--ink-soft:#4d5a72;
  --gold:#8a6d1e;--gold-bg:#f1e6c4;--brick:#93362a;--brick-bg:#f2ddd8;--teal:#1f5c50;--teal-bg:#d9e6e2;
  --shadow:0 8px 24px -12px rgba(27,42,74,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:repeating-linear-gradient(180deg,transparent,transparent 34px,rgba(27,42,74,0.05) 35px),var(--paper);
  color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
  display:flex;justify-content:center;padding:24px 14px calc(64px + env(safe-area-inset-bottom));
}
.sheet{width:100%;max-width:680px;}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:16px;}
header .brand{font-weight:800;font-size:1.7rem;letter-spacing:-0.02em;}
header .brand em{font-style:normal;color:var(--gold);}
header .tagline{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);}
header .date{font-size:0.72rem;color:var(--ink-soft);text-align:right;}

.sync-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;margin-bottom:20px;font-size:0.82rem;
}
.sync-bar .status-text{color:var(--ink-soft);flex:1;min-width:140px;}
.sync-bar input{
  flex:1;min-width:140px;padding:10px;font-size:16px;border:1px solid var(--paper-line);
  border-radius:7px;font-family:inherit;
}
.sync-bar button{
  padding:10px 16px;min-height:44px;border:none;border-radius:7px;background:var(--ink);color:var(--paper);
  font-weight:600;font-size:0.85rem;cursor:pointer;
}
.sync-bar button:hover{background:var(--teal);}
.sync-bar button.link-btn{background:none;color:var(--brick);text-decoration:underline;padding:8px 4px;min-height:auto;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:#9a9384;flex-shrink:0;}
.dot.on{background:var(--teal);}
.dot.pending{background:var(--gold);}
.dot.off{background:var(--brick);}

.stamps{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-bottom:24px;}
.stamp{border:2px dashed currentColor;border-radius:12px;padding:12px 8px;text-align:center;background:var(--card);}
.stamp.income{color:var(--gold);background:var(--gold-bg);}
.stamp.expenses{color:var(--brick);background:var(--brick-bg);}
.stamp.balance{color:var(--teal);background:var(--teal-bg);}
.stamp h3{font-weight:700;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;opacity:0.85;margin-bottom:5px;}
.stamp p{font-weight:800;font-size:1.05rem;color:var(--ink);word-break:break-word;}

form{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:24px;}
.form-title{font-weight:700;font-size:0.8rem;letter-spacing:0.04em;margin-bottom:10px;color:var(--ink-soft);text-transform:uppercase;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
input,select,button{font-family:inherit;font-size:16px;padding:12px;border:1px solid var(--paper-line);border-radius:8px;background:#fff;color:var(--ink);min-height:44px;}
input{flex:1;min-width:0;}
select{flex:0 0 120px;}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
.btn-add{flex:0 0 auto;background:var(--ink);color:var(--paper);border:none;font-weight:700;cursor:pointer;padding:12px 22px;}
.btn-add:hover{background:var(--teal);}
.btn-add:disabled{opacity:0.6;}

.ledger{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.ledger-head{display:grid;grid-template-columns:1fr 1.5fr 1fr 32px;gap:6px;padding:10px 12px;background:var(--ink);color:var(--paper);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;}
.ledger-head span:nth-child(3){text-align:right;}
.ledger-body{max-height:420px;overflow-y:auto;}
.entry{display:grid;grid-template-columns:1fr 1.5fr 1fr 32px;gap:6px;padding:12px;align-items:center;border-bottom:1px solid var(--paper-line);font-size:0.85rem;}
.entry:last-child{border-bottom:none;}
.entry:nth-child(even){background:rgba(27,42,74,0.03);}
.entry .desc{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry .date-cell{font-size:0.68rem;color:var(--ink-soft);}
.entry .amt{text-align:right;font-weight:600;}
.entry .amt.credit{color:var(--gold);}
.entry .amt.debit{color:var(--brick);}
.void-btn{background:none;border:none;color:var(--brick);cursor:pointer;font-size:1.1rem;width:36px;height:36px;border-radius:50%;justify-self:end;}
.void-btn:hover{background:var(--brick-bg);}

.empty-state{padding:32px 18px;text-align:center;color:var(--ink-soft);font-size:0.88rem;}
.empty-state strong{display:block;font-weight:700;color:var(--ink);margin-bottom:4px;}

footer{text-align:center;margin-top:18px;font-size:0.66rem;color:var(--ink-soft);letter-spacing:0.03em;}

@media (max-width:480px){
  .stamps{grid-template-columns:1fr 1fr;}
  .stamps .stamp:nth-child(3){grid-column:1/3;}
  .ledger-head,.entry{grid-template-columns:0.9fr 1.4fr 0.9fr 32px;}
  .row{flex-wrap:wrap;}
  select{flex:1 1 100%;}
  .sync-bar{font-size:0.78rem;}
}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;}
.main{min-width:0;}

.cal-panel{
  position:sticky;top:16px;background:var(--card);border:1px solid var(--paper-line);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden;
}
.clock{background:var(--ink);color:var(--paper);padding:16px 16px 14px;text-align:center;}
.clock .time{font-weight:800;font-size:2.1rem;letter-spacing:0.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.clock .longdate{font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;opacity:0.8;margin-top:4px;}
.cal-toggle{
  display:none;width:100%;margin-top:10px;min-height:38px;padding:8px;font-size:0.8rem;font-weight:600;
  background:rgba(255,255,255,0.12);color:var(--paper);border:1px solid rgba(255,255,255,0.25);cursor:pointer;
}
.cal-body{padding:14px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;}
.cal-nav .month{font-weight:700;font-size:0.95rem;flex:1;text-align:center;}
.cal-nav button{min-height:40px;min-width:40px;padding:6px 10px;cursor:pointer;font-weight:700;background:#fff;}
.cal-nav button:hover{background:var(--teal-bg);}
.cal-nav .today-btn{font-size:0.75rem;padding:6px 12px;}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-weekdays span{text-align:center;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);padding:4px 0;font-weight:700;}
.cal-day{
  position:relative;min-height:44px;padding:4px 0 8px;border:1px solid transparent;border-radius:8px;
  background:none;font-size:0.88rem;font-weight:600;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.cal-day:hover{background:var(--teal-bg);}
.cal-day.other{color:var(--ink-soft);opacity:0.45;font-weight:500;}
.cal-day.today{border-color:var(--gold);background:var(--gold-bg);}
.cal-day.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1;}
.cal-day .dots{display:flex;gap:3px;height:5px;}
.cal-day .dots i{width:5px;height:5px;border-radius:50%;display:block;}
.cal-day .dots i.inc{background:var(--gold);}
.cal-day .dots i.exp{background:var(--brick);}
.cal-day.selected .dots i.inc{background:#e6c867;}
.cal-day.selected .dots i.exp{background:#f0a99f;}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:0.68rem;color:var(--ink-soft);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;}
.cal-summary{margin-top:12px;padding:10px 12px;border-top:1px dashed var(--paper-line);font-size:0.82rem;color:var(--ink-soft);}
.cal-summary strong{color:var(--ink);display:block;margin-bottom:3px;}
.cal-summary .inc{color:var(--gold);font-weight:700;}
.cal-summary .exp{color:var(--brick);font-weight:700;}

/* phones: calendar moves above the content and collapses */
@media (max-width:899px){
  .layout{grid-template-columns:1fr;gap:16px;}
  .cal-panel{position:static;order:-1;}
  .cal-toggle{display:block;}
  .cal-body{display:none;}
  .cal-panel.open .cal-body{display:block;}
}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div>
      <div class="brand">TAC <em>Fundi</em></div>
      <div class="tagline">Personal Ledger</div>
    </div>
    <div class="date" id="today"></div>
  </header>
<div class="layout">
  <div class="main">
    <!-- your existing app content goes here -->
  </div>

  <aside class="cal-panel" id="cal-panel" aria-label="Calendar">
    <div class="clock">
      <div class="time" id="clock-time">--:--:--</div>
      <div class="longdate" id="clock-date"></div>
      <button type="button" class="cal-toggle" id="cal-toggle" aria-expanded="false">Show calendar</button>
    </div>
    <div class="cal-body">
      <div class="cal-nav">
        <button type="button" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
        <div class="month" id="cal-title"></div>
        <button type="button" id="cal-next" aria-label="Next month">&rsaquo;</button>
        <button type="button" class="today-btn" id="cal-today">Today</button>
      </div>
      <div class="cal-weekdays">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span><i style="background:var(--gold)"></i>Income</span>
        <span><i style="background:var(--brick)"></i>Expense</span>
      </div>
      <div class="cal-summary" id="cal-summary"></div>
    </div>
  </aside>
</div>
  <div class="sync-bar" id="sync-bar">
    <span class="dot off" id="sync-dot"></span>
    <span class="status-text" id="sync-status">Not connected — saving to this device only</span>
    <input type="text" id="sync-code-input" placeholder="Your sync code (any word/phrase)" style="display:none" autocomplete="off" />
    <button id="sync-connect-btn" type="button">Connect sync</button>
    <button class="link-btn" id="sync-forget-btn" type="button" style="display:none">Disconnect</button>
  </div>

  <div class="stamps">
    <div class="stamp income"><h3>Income</h3><p id="total-income">R0.00</p></div>
    <div class="stamp expenses"><h3>Expenses</h3><p id="total-expenses">R0.00</p></div>
    <div class="stamp balance"><h3>Balance</h3><p id="total-balance">R0.00</p></div>
  </div>

  <form id="budget-form">
    <div class="form-title">New entry</div>
    <div class="row">
      <input type="text" id="desc" placeholder="Description — e.g. Salary, Rent, Groceries" required maxlength="60" />
    </div>
    <div class="row">
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <input type="number" id="amount" inputmode="decimal" placeholder="Amount" step="0.01" min="0.01" required />
      <button type="submit" class="btn-add" id="add-btn">Add</button>
    </div>
  </form>

  <div class="ledger">
    <div class="ledger-head"><span>Date</span><span>Description</span><span>Amount</span><span></span></div>
    <div class="ledger-body" id="item-list"></div>
  </div>

  <footer>Saved instantly on this device · syncs to your other devices once connected</footer>
</div>

<script type="module">
  // ============================================================
  // STEP 1 — Paste your Firebase config below.
  // Get it from: Firebase Console > Project settings > General
  // > Your apps > (Web app) > SDK setup and configuration.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDZeCi-5SRBzV3-QNj8hPBCh50LXDV5J0Q",
    authDomain: "tac-fundi-personal-ledger.firebaseapp.com",
    projectId: "tac-fundi-personal-ledger",
    storageBucket: "tac-fundi-personal-ledger.firebasestorage.app",
    messagingSenderId: "303313829234",
    appId: "1:303313829234:web:031b1d32595f199d57b1eb"
  };
  const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "YOUR_API_KEY";

  const LOCAL_KEY = 'tacfundi_ledger_v1';
  const CODE_KEY = 'tacfundi_sync_code';
  let entries = [];
  try { entries = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch(e) { entries = []; }

  const form = document.getElementById('budget-form');
  const descInput = document.getElementById('desc');
  const amountInput = document.getElementById('amount');
  const typeInput = document.getElementById('type');
  const itemList = document.getElementById('item-list');
  const addBtn = document.getElementById('add-btn');
  const syncDot = document.getElementById('sync-dot');
  const syncStatus = document.getElementById('sync-status');
  const syncInput = document.getElementById('sync-code-input');
  const syncBtn = document.getElementById('sync-connect-btn');
  const forgetBtn = document.getElementById('sync-forget-btn');

  document.getElementById('today').textContent =
    new Date().toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });

  function fmt(n){ return 'R' + n.toLocaleString('en-ZA', { minimumFractionDigits:2, maximumFractionDigits:2 }); }

  function saveLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); } catch(e) {} }

  function render(){
    itemList.innerHTML = '';
    let income = 0, expenses = 0;

    if (entries.length === 0){
      itemList.innerHTML = '<div class="empty-state"><strong>No entries yet</strong>Add your first income or expense above.</div>';
    }

    // newest first
    entries.slice().reverse().forEach((entry) => {
      const val = parseFloat(entry.amount) || 0;
      if (entry.type === 'income') income += val; else expenses += val;

      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="date-cell">${entry.date || ''}</div>
        <div class="desc" title="${entry.desc}">${entry.desc}</div>
        <div class="amt ${entry.type === 'income' ? 'credit' : 'debit'}">${entry.type === 'income' ? '+' : '-'}${fmt(val)}</div>
        <button class="void-btn" aria-label="Delete entry" data-id="${entry.id}">&times;</button>
      `;
      itemList.appendChild(row);
    });

    document.getElementById('total-income').textContent = fmt(income);
    document.getElementById('total-expenses').textContent = fmt(expenses);
    document.getElementById('total-balance').textContent = fmt(income - expenses);

    saveLocal();
  }

  itemList.addEventListener('click', (e) => {
    const btn = e.target.closest('.void-btn');
    if (!btn) return;
    entries = entries.filter(en => String(en.id) !== btn.dataset.id);
    render();
    pushToCloud();
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    entries.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      desc: descInput.value.trim(),
      amount: amountInput.value,
      type: typeInput.value,
      date: new Date().toLocaleDateString('en-ZA', { day:'2-digit', month:'short' }),
      ts: Date.now()
    });
    descInput.value = '';
    amountInput.value = '';
    render();
    pushToCloud();
    descInput.focus();
  });

  render();

  // ============================================================
  // STEP 2 — Firebase sync (works offline, syncs when reconnected)
  // ============================================================
  let docRef = null, applyingRemote = false;
  let setDocFn = null;
  const syncCodeSaved = localStorage.getItem(CODE_KEY);

  function setStatus(state, text){
    syncDot.className = 'dot ' + state;
    syncStatus.textContent = text;
  }

  function codeToId(code){ return code.trim().toLowerCase().replace(/\s+/g, '-'); }

  async function pushToCloud(){
    if (!docRef || applyingRemote || !setDocFn) return;
    try {
      await setDocFn(docRef, { entries, updatedAt: Date.now() });
      setStatus(navigator.onLine ? 'on' : 'pending', navigator.onLine ? 'Synced' : 'Saved locally — will sync when back online');
    } catch (err) {
      setStatus('pending', 'Saved locally — will sync when back online');
    }
  }

  async function connectSync(code){
    if (!FIREBASE_CONFIGURED){
      setStatus('off', 'Sync isn\u2019t set up yet — add your Firebase config in the file first');
      return;
    }
    try {
      setStatus('pending', 'Connecting…');
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js');
      const { getAuth, signInAnonymously } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
      const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, onSnapshot } =
        await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      // persistentLocalCache = full offline support: reads/writes work with no
      // connection, then Firestore auto-syncs the queue once you're back online.
      const db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
      setDocFn = setDoc;

      await signInAnonymously(auth);

      docRef = doc(db, 'ledgers', codeToId(code));

      onSnapshot(docRef, { includeMetadataChanges: true }, (snap) => {
        const fromCache = snap.metadata.fromCache;
        if (snap.exists()){
          applyingRemote = true;
          entries = snap.data().entries || [];
          render();
          applyingRemote = false;
          setStatus(fromCache ? 'pending' : 'on', fromCache ? 'Offline — showing last synced copy' : 'Synced');
        } else {
          // first time this code is used anywhere — seed it with what's on this device
          pushToCloud();
        }
      }, () => {
        setStatus('pending', 'Offline — will sync when back online');
      });

      localStorage.setItem(CODE_KEY, code);
      syncInput.style.display = 'none';
      syncBtn.style.display = 'none';
      forgetBtn.style.display = 'inline-block';
    } catch (err) {
      console.error(err);
      const code = err && err.code ? err.code : (err && err.message ? err.message : 'unknown error');
      setStatus('off', 'Could not connect: ' + code);
    }
  }

  syncBtn.addEventListener('click', () => {
    if (syncInput.style.display === 'none' || !syncInput.style.display){
      syncInput.style.display = 'inline-block';
      syncInput.focus();
      return;
    }
    const code = syncInput.value.trim();
    if (code) connectSync(code);
  });

  syncInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); syncBtn.click(); }
  });

  forgetBtn.addEventListener('click', () => {
    localStorage.removeItem(CODE_KEY);
    location.reload();
  });

  window.addEventListener('online', () => { if (docRef) setStatus('on', 'Back online — syncing'); pushToCloud(); });
  window.addEventListener('offline', () => { if (docRef) setStatus('pending', 'Offline — changes are saved locally'); });

  if (syncCodeSaved){
    syncInput.value = syncCodeSaved;
    connectSync(syncCodeSaved);
  }
  // ---- helpers ----
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
function dateFromKey(k){ const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function fmt(n){ return 'R' + n.toLocaleString('en-ZA', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function entryKey(e){
  const t = Number(e.ts) || parseInt(e.id, 10);
  return Number.isFinite(t) ? keyOf(new Date(t)) : null;
}

// ---- state ----
const now0 = new Date();
let viewY = now0.getFullYear(), viewM = now0.getMonth();
let selected = null;               // 'YYYY-MM-DD' or null
let lastToday = todayKey();

const calGrid = document.getElementById('cal-grid');
const calTitle = document.getElementById('cal-title');
const calSummary = document.getElementById('cal-summary');
const clockTime = document.getElementById('clock-time');
const clockDate = document.getElementById('clock-date');
const calPanel = document.getElementById('cal-panel');
const calToggle = document.getElementById('cal-toggle');

// ---- live clock (also detects midnight) ----
function renderHeaderDate(){
  clockDate.textContent = new Date().toLocaleDateString('en-ZA',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function tick(){
  const n = new Date();
  clockTime.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  const tk = keyOf(n);
  if (tk !== lastToday){
    lastToday = tk;
    renderHeaderDate();
    renderCalendar();
  }
}

// ---- per-day totals, built from your `entries` array ----
function dayTotals(){
  const map = {};
  entries.forEach(e => {
    const k = entryKey(e); if (!k) return;
    const v = parseFloat(e.amount) || 0;
    const o = map[k] || (map[k] = { inc:0, exp:0, n:0 });
    if (e.type === 'income') o.inc += v; else o.exp += v;
    o.n++;
  });
  return map;
}

// ---- draw the month ----
function renderCalendar(){
  const totals = dayTotals();
  const first = new Date(viewY, viewM, 1);
  const offset = (first.getDay() + 6) % 7;        // Monday-first
  const tk = todayKey();
  calTitle.textContent = first.toLocaleDateString('en-ZA', { month:'long', year:'numeric' });

  let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(viewY, viewM, 1 - offset + i);
    const k = keyOf(d);
    const t = totals[k];
    const cls = ['cal-day'];
    if (d.getMonth() !== viewM) cls.push('other');
    if (k === tk) cls.push('today');
    if (k === selected) cls.push('selected');
    const dots = t
      ? '<span class="dots">' + (t.inc ? '<i class="inc"></i>' : '') + (t.exp ? '<i class="exp"></i>' : '') + '</span>'
      : '<span class="dots"></span>';
    const aria = d.toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
      + (t ? ', ' + t.n + (t.n === 1 ? ' entry' : ' entries') : '');
    html += '<button type="button" class="' + cls.join(' ') + '" data-key="' + k +
            '" aria-label="' + aria + '" aria-pressed="' + (k === selected) + '">' + d.getDate() + dots + '</button>';
  }
  calGrid.innerHTML = html;

  // summary: selected day, otherwise the month being viewed
  const prefix = viewY + '-' + pad(viewM + 1) + '-';
  if (selected){
    const t = totals[selected] || { inc:0, exp:0, n:0 };
    calSummary.innerHTML = '<strong>' +
      esc(dateFromKey(selected).toLocaleDateString('en-ZA', { weekday:'short', day:'numeric', month:'short' })) +
      ' · ' + t.n + (t.n === 1 ? ' entry' : ' entries') + '</strong>' +
      '<span class="inc">+' + fmt(t.inc) + '</span> &nbsp; <span class="exp">-' + fmt(t.exp) + '</span>';
  } else {
    let inc = 0, exp = 0, n = 0;
    Object.keys(totals).forEach(k => {
      if (k.startsWith(prefix)){ inc += totals[k].inc; exp += totals[k].exp; n += totals[k].n; }
    });
    calSummary.innerHTML = '<strong>' + esc(first.toLocaleDateString('en-ZA', { month:'long' })) +
      ' · ' + n + (n === 1 ? ' entry' : ' entries') + '</strong>' +
      '<span class="inc">+' + fmt(inc) + '</span> &nbsp; <span class="exp">-' + fmt(exp) + '</span>';
  }
}

// ---- interaction ----
function setSelected(key){
  selected = key;
  if (key){
    const d = dateFromKey(key);
    viewY = d.getFullYear(); viewM = d.getMonth();
  }
  render();   // your main render(); it should call renderCalendar() and filter by `selected`
}
function shiftMonth(delta){
  const d = new Date(viewY, viewM + delta, 1);
  viewY = d.getFullYear(); viewM = d.getMonth();
  renderCalendar();
}

calGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.cal-day');
  if (!btn) return;
  const k = btn.dataset.key;
  setSelected(k === selected ? null : k);     // click again to clear
});
document.getElementById('cal-prev').addEventListener('click', () => shiftMonth(-1));
document.getElementById('cal-next').addEventListener('click', () => shiftMonth(1));
document.getElementById('cal-today').addEventListener('click', () => {
  const n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth();
  setSelected(todayKey());
});
calToggle.addEventListener('click', () => {
  const open = calPanel.classList.toggle('open');
  calToggle.textContent = open ? 'Hide calendar' : 'Show calendar';
  calToggle.setAttribute('aria-expanded', open);
});

// ---- start ----
renderHeaderDate();
tick();
setInterval(tick, 1000);
renderCalendar();
</script>
